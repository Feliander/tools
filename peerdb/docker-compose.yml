name: peerdb-local

x-postgres-env: &postgres-env
  PEERDB_CATALOG_HOST: host.docker.internal
  PEERDB_CATALOG_PORT: 5432
  PEERDB_CATALOG_USER: postgres
  PEERDB_CATALOG_PASSWORD: postgres
  PEERDB_CATALOG_DATABASE: postgres

x-worker-env: &worker-env
  TEMPORAL_HOST_PORT: temporal:7233
  PEERDB_TEMPORAL_NAMESPACE: default
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ACCESS_KEY_ID: miniouser
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_SECRET_ACCESS_KEY: admin123
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_REGION: us-east-1
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ENDPOINT_URL_S3: http://host.docker.internal:9000
  PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME: peerdb

services:

  temporal:
    image: temporalio/auto-setup:1.29
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: host.docker.internal
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal-dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: [CMD, tctl, --address, temporal:7233, cluster, health]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal-init:
    image: temporalio/auto-setup:1.29
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        temporal --address temporal:7233 operator search-attribute list
        --namespace default | grep -w MirrorName
        || temporal --address temporal:7233 operator search-attribute create
        --name MirrorName --type Text --namespace default
    restart: "no"

  flow-api:
    image: ghcr.io/peerdb-io/flow-api:stable-v0.37.0
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      temporal-init:
        condition: service_completed_successfully
    environment:
      <<: [*postgres-env, *worker-env]
      PEERDB_ALLOWED_TARGETS: ""
    ports:
      - 127.0.0.1:8113:8113

  flow-snapshot-worker:
    image: ghcr.io/peerdb-io/flow-snapshot-worker:stable-v0.37.0
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      temporal-init:
        condition: service_completed_successfully
    environment:
      <<: [*postgres-env, *worker-env]

  flow-worker:
    image: ghcr.io/peerdb-io/flow-worker:stable-v0.37.0
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      temporal-init:
        condition: service_completed_successfully
    environment:
      <<: [*postgres-env, *worker-env]

  peerdb-server:
    image: ghcr.io/peerdb-io/peerdb-server:stable-v0.37.0
    restart: unless-stopped
    stop_signal: SIGINT
    depends_on:
      flow-api:
        condition: service_started
    environment:
      <<: *postgres-env
      PEERDB_PASSWORD: ""
      PEERDB_FLOW_SERVER_ADDRESS: grpc://flow-api:8112
      RUST_LOG: info
    ports:
      - 127.0.0.1:9900:9900

  peerdb-ui:
    image: ghcr.io/peerdb-io/peerdb-ui:stable-v0.37.0
    restart: unless-stopped
    depends_on:
      flow-api:
        condition: service_started
    environment:
      <<: *postgres-env
      HOSTNAME: 0.0.0.0
      PEERDB_FLOW_SERVER_HTTP: http://flow-api:8113
      NEXTAUTH_SECRET: local-peerdb-only-change-me
      NEXTAUTH_URL: http://localhost:3000
      PEERDB_ALLOWED_TARGETS: ""
      PEERDB_CLICKHOUSE_ALLOWED_DOMAINS: ""
    ports:
      - 127.0.0.1:3000:3000
